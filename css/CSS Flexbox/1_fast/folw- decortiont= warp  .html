<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>css_flex</title>
    <style>
        .container {
            border: 4px solid yellowgreen;
            display: flex;
            /* flex-direction: column; */
            align-content: center;

            /* justify-content: center; */
            height: 100vw;

            /* flex-direction*/

            /* flex-direction: column; */

            /* flex-wrap for overflow */

            flex-wrap: wrap;
        }

        .item {
            border: 2px solid;
            background-color: rgb(127, 171, 237);
            height: 60px;
            width: 60px;
            margin: 4px;

        }
    </style>
</head>

<body>
    <div class="container">

        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">3</div>
        <div class="item">3</div>
        <div class="item">3</div>
        <div class="item">3</div>
        <div class="item">3</div>
      

        <div class="item">5</div>
        <div class="item">3</div>
        <div class="item">3</div>
        <div class="item">3</div>

        <div class="item">5</div>
    </div>
</body>

</html>
