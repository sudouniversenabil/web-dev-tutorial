<!DOCTYPE html>
<html>

<head>
    <style>
        .container {
            display: flex;
        }

        .box {
            width: 80px;
            height: 80px;
            margin: 5px;
            background: teal;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box1 {
            order: 2;
        }

        .box2 {
            order: 1;
        }

        .box3 {
            order: 3;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
    </div>

</body>

</html>
