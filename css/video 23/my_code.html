<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 2px solid salmon;
            display: inline-block;
            margin: 10px;
            padding: 30px;
            width: 230px;
            /* display:none; */
        }

        .box1 {
            /* visibility: hidden; */
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="box box1">
        i am a box
    </div>
    <div class="box">
        iam another box
    </div>

    <span>
        i iam a span
    </span>

</body>

</html>
