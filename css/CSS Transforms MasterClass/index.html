<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css transfromt</title>
    <style>
        .contaner{
            border: 3px solid purple;
            height: 100vw;
            width: 80vw;

        }
        .box{
            border: 2px solid black;
            height: 40px;
            width: 50px;
            transform: rotate(0.12turn);
        }
    </style>
</head>
<body>
    <div class="contaner">
        <div class="box">
            box
        </div>
    </div>
</body>
</html>
