<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css box-model</title>
    <style>
        *{
            background-color: black;
            margin: 0;
            padding: 0;
        }
        .box{
            background-color: aqua;


        }
        .box1{
            color:goldenrod;
            margin: 35px;
            padding: 35px;
            height: 70px;
            border: 2px solid red;
           
            box-sizing: border-box;
            
        }
        
        
        .box2{
            color:goldenrod;
            margin: 35px;
            padding: 35px;
            height: 70px;
            border: 2px solid red;
            box-sizing: border-box;
            
           
        }

    </style>

    
</head>

<body>
    <div class="box box1"> this is box one </div>
    <div class="box box2">this is box two</div>
</body>

</html>
