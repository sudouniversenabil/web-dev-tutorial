<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;

        }

        .box {
            border: 2px solid;
            width: 60vw;
            margin: 3px;
            padding: 20px;

            /* border: ; */
        }

        .box1 {
            background-color: chartreuse;
            /* position: relative; */

        }

        .box2 {
            background-color: magenta;

            position: absolute;
            top: 0px;
        }

        .box3 {
            background-color: maroon;
        }

        .box4 {
            background-color: tomato;
        }

        .parent {
            margin: 4px;
            padding: 10px;
            border: 2px solid gold;
            /* position: relative; */
            border-radius: 5px;
            filter: invert(0)
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>

    </div>


</body>

</html>
